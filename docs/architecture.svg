<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="620" viewBox="0 0 1100 620" font-family="sans-serif" font-size="14">
  <title>WaferSequenceSim 아키텍처</title>
  <desc>앱 계층에서 Contracts.ISimulator를 거쳐 Core(시퀀스·계측)와 Devices로 내려가는 의존 구조. 화살표는 의존 방향.</desc>
  <defs>
